k</text><text x="140" y="354" font-family="Segoe UI" font-size="12" font-weight="400" text-anchor="start" fill="#F5F7FC">Repair uses the bundled file. No network connection is needed.</text><text x="140" y="381" font-family="Segoe UI" font-size="12" font-weight="400" text-anchor="start" fill="#9BA2B1">Destination</text><rect x="140" y="387" width="508" height="51" rx="12" fill="#12161D" stroke="#333947" stroke-width="1" /><text x="152" y="406" font-family="Segoe UI" font-size="12" font-weight="400" text-anchor="start" fill="#F5F7FC">D:\Медиатека\Учебные материалы\Готовые инструменты\Portable Apps\</text><text x="152" y="422" font-family="Segoe UI" font-size="12" font-weight="400" text-anchor="start" fill="#F5F7FC">Архив рабочих приложений\MediaForge\Data\v2\manifests\qwen-cu128-final3.json</text></g></g><g inkscape:groupmode="layer" inkscape:label="Pinned Cancel and confirmation"><line x1="140" y1="459" x2="660" y2="459" stroke="#333947" stroke-width="1" stroke-linecap="round" /><g inkscape:groupmode="layer" inkscape:label="Button | primary | Repair"><rect x="584" y="468" width="76" height="44" rx="14" fill="#5AA9FF" stroke="#5AA9FF" stroke-width="1" /><text x="622.0" y="495.0" font-family="Segoe UI" font-size="13" font-weight="600" text-anchor="middle" fill="#0B0D11">Repair</text></g><g inkscape:groupmode="layer" inkscape:label="Button | secondary | Cancel"><rect x="495" y="465" width="82" height="50" rx="17" fill="none" stroke="#79BEFF" stroke-width="2" /><rect x="498" y="468" width="76" height="44" rx="14" fill="#20252F" stroke="#333947" stroke-width="1" /><text x="536.0" y="495.0" font-family="Segoe UI" font-size="13" font-weight="600" text-anchor="middle" fill="#F5F7FC">Cancel</text></g></g></svg>