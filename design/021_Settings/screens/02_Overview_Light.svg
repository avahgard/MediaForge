<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1440" height="900" viewBox="0 0 1440 900" role="img"><title>02_Overview_Light</title><g inkscape:groupmode="layer" inkscape:label="Workspace and Settings navigation"><rect x="0" y="0" width="1440" height="900" rx="0" fill="#F3F5F8" /><rect x="18" y="18" width="190" height="864" rx="24" fill="#FFFFFF" stroke="#DDE2EA" stroke-width="1" /><text x="36" y="54" font-family="Segoe UI" font-size="18" font-weight="600" text-anchor="start" fill="#171C26">MediaForge</text><circle cx="54" cy="114" r="7" fill="#576579" /><text x="76" y="119" font-family="Segoe UI" font-size="14" font-weight="400" text-anchor="start" fill="#576579">Media</text><circle cx="54" cy="170" r="7" fill="#576579" /><text x="76" y="175" font-family="Segoe UI" font-size="14" font-weight="400" text-anchor="start" fill="#576579">Dub</text><circle cx="54" cy="825" r="8" fill="none" stroke="#576579" /><circle cx="54" cy="825" r="2" fill="#576579" /><text x="76" y="830" font-family="Segoe UI" font-size="14" font-weight="400" text-anchor="start" fill="#2565C5">Settings</text><text x="242" y="55" font-family="Segoe UI" font-size="24" font-weight="600" text-anchor="start" fill="#171C26">Settings</text><rect x="242" y="74" width="401" height="44" rx="14" fill="#E8EDF5" stroke="#DDE2EA" stroke-width="1" /><text x="302.0" y="100" font-family="Segoe UI" font-size="13" font-weight="400" text-anchor="middle" fill="#576579">Appearance</text><rect x="362" y="78" width="110" height="36" rx="11" fill="#F0F2F6" stroke="#DDE2EA" stroke-width="1" /><rect x="409.0" y="108" width="16" height="2" rx="1" fill="#397BE5" /><text x="417.0" y="100" font-family="Segoe UI" font-size="13" font-weight="600" text-anchor="middle" fill="#171C26">Dub Models</text><text x="518.0" y="100" font-family="Segoe UI" font-size="13" font-weight="400" text-anchor="middle" fill="#576579">Storage</text><text x="601.5" y="100" font-family="Segoe UI" font-size="13" font-weight="400" text-anchor="middle" fill="#576579">About</text></g><g inkscape:groupmode="layer" inkscape:label="Dub Models panel"><rect x="242" y="130" width="880" height="571" rx="24" fill="#FFFFFF" stroke="#DDE2EA" stroke-width="1" /><text x="264" y="167" font-family="Segoe UI" font-size="18" font-weight="600" text-anchor="start" fill="#171C26">Dub Models</text></g><g inkscape:groupmode="layer" inkscape:label="Pinned status and actions"><rect x="264" y="184" width="836" height="142" rx="16" fill="#E8EDF5" stroke="#DDE2EA" stroke-width="1" /><g inkscape:groupmode="layer" inkscape:label="Button | primary | Install All"><rect x="995" y="196" width="91" height="44" rx="14" fill="#2565C5" stroke="#2565C5" stroke-width="1" /><text x="1040.5" y="223.0" font-family="Segoe UI" font-size="13" font-weight="600" text-anchor="middle" fill="#FFFFFF">Install All</text></g><text x="278" y="214" font-family="Segoe UI" font-size="16" font-weight="600" text-anchor="start" fill="#171C26">Set up dubbing</text><text x="278" y="249" font-family="Segoe UI" font-size="13" font-weight="400" text-anchor="start" fill="#576579">Install the six components needed for English → Russian dubbing.</text><text x="278" y="271" font-family="Segoe UI" font-size="13" font-weight="600" text-anchor="start" fill="#171C26">About 5.44 GiB download  ·  About 14.69 GiB free for setup</text><text x="278" y="296" font-family="Segoe UI" font-size="12" font-weight="400" text-anchor="start" fill="#576579">Internet for setup. Qwen requires an NVIDIA GPU with a compatible driver.</text></g><g inkscape:groupmode="layer" inkscape:label="Components header"><text x="264" y="374" font-family="Segoe UI" font-size="14" font-weight="600" text-anchor="start" fill="#171C26">Components</text><g inkscape:groupmode="layer" inkscape:label="Button | secondary | Verify offline"><rect x="990" y="348" width="110" height="34" rx="14" fill="#F0F2F6" stroke="#DDE2EA" stroke-width="1" /><text x="1045.0" y="370.0" font-family="Segoe UI" font-size="13" font-weight="600" text-anchor="middle" fill="#171C26">Verify offline</text></g></g><g inkscape:groupmode="layer" inkscape:label="Scrollable component inventory"><line x1="264" y1="389" x2="1100" y2="389" stroke="#DDE2EA" stroke-width="1" stroke-linecap="round" /><g inkscape:groupmode="layer" inkscape:label="Component row | CPU Runtime"><text x="274" y="408" font-family="Segoe UI" font-size="13" font-weight="600" text-anchor="start" fill="#171C26">CPU Runtime</text><text x="274" y="424" font-family="Segoe UI" font-size="12" font-weight="400" text-anchor="start" fill="#576579">Runs speech recognition and translation</text><text x="1068" y="415" font-family="Segoe UI" font-size="12" font-weight="400" text-anchor="end" fill="#576579">Not installed</text><line x1="1081" y1="411.0" x2="1085" y2="415.0" stroke="#576579" stroke-width="1.5" stroke-linecap="round" /><line x1="1085" y1="415.0" x2="1089" y2="411.0" stroke="#576579" stroke-width="1.5" stroke-linecap="round" /><line x1="264" y1="437" x2="1100" y2="437" stroke="#DDE2EA" stroke-width="1" stroke-linecap="round" /></g><g inkscape:groupmode="layer" inkscape:label="Component row | Whisper Base"><text x="274" y="456" font-family="Segoe UI" font-size="13" font-weight="600" text-anchor="start" fill="#171C26">Whisper Base</text><text x="274" y="472" font-family="Segoe UI" font-size="12" font-weight="400" text-anchor="start" fill="#576579">Recognizes English speech</text><text x="1068" y="463" font-family="Segoe UI" font-size="12" font-weight="400" text-anchor="end" fill="#576579">Not installed</text><line x1="1081" y1="459.0" x2="1085" y2="463.0" stroke="#576579" stroke-width="1.5" stroke-linecap="round" /><line x1="1085" y1="463.0" x2="1089" y2="459.0" stroke="#576579" stroke-width="1.5" stroke-linecap="round" /><line x1="264" y1="485" x2="1100" y2="485" stroke="#DDE2EA" stroke-width="1" stroke-linecap="round" /></g><g inkscape:groupmode="layer" inkscape:label="Component row | Argos EN → RU"><text x="274" y="504" font-family="Segoe UI" font-size="13" font-weight="600" text-anchor="start" fill="#171C26">Argos EN → RU</text><text x="274" y="520" font-family="Segoe UI" font-size="12" font-weight="400" text-anchor="start" fill="#576579">Translates English to Russian</text><text x="1068" y="511" font-family="Segoe UI" font-size="12" font-weight="400" text-anchor="end" fill="#576579">Not installed</text><line x1="1081" y1="507.0" x2="1085" y2="511.0" stroke="#576579" stroke-width="1.5" stroke-linecap="round" /><line x1="1085" y1="511.0" x2="1089" y2="507.0" stroke="#576579" stroke-width="1.5" stroke-linecap="round" /><line x1="264" y1="533" x2="1100" y2="533" stroke="#DDE2EA" stroke-width="1" stroke-linecap="round" /></g><g inkscape:groupmode="layer" inkscape:label="Component row | Qwen CUDA Runtime"><text x="274" y="552" font-family="Segoe UI" font-size="13" font-weight="600" text-anchor="start" fill="#171C26">Qwen CUDA Runtime</text><text x="274" y="568" font-family="Segoe UI" font-size="12" font-weight="400" text-anchor="start" fill="#576579">Runs voice synthesis on NVIDIA GPUs</text><text x="1068" y="559" font-family="Segoe UI" font-size="12" font-weight="400" text-anchor="end" fill="#576579">Not installed</text><line x1="1081" y1="555.0" x2="1085" y2="559.0" stroke="#576579" stroke-width="1.5" stroke-linecap="round" /><line x1="1085" y1="559.0" x2="1089" y2="555.0" stroke="#576579" stroke-width="1.5" stroke-linecap="round" /><line x1="264" y1="581" x2="1100" y2="581" stroke="#DDE2EA" stroke-width="1" stroke-linecap="round" /></g><g inkscape:groupmode="layer" inkscape:label="Component row | Qwen3-TTS CustomVoice"><text x="274" y="600" font-family="Segoe UI" font-size="13" font-weight="600" text-anchor="start" fill="#171C26">Qwen3-TTS CustomVoice</text><text x="274" y="616" font-family="Segoe UI" font-size="12" font-weight="400" text-anchor="start" fill="#576579">Generates the Russian voice</text><text x="1068" y="607" font-family="Segoe UI" font-size="12" font-weight="400" text-anchor="end" fill="#576579">Not installed</text><line x1="1081" y1="603.0" x2="1085" y2="607.0" stroke="#576579" stroke-width="1.5" stroke-linecap="round" /><line x1="1085" y1="607.0" x2="1089" y2="603.0" stroke="#576579" stroke-width="1.5" stroke-linecap="round" /><line x1="264" y1="629" x2="1100" y2="629" stroke="#DDE2EA" stroke-width="1" stroke-linecap="round" /></g><g inkscape:groupmode="layer" inkscape:label="Component row | Qwen 12 Hz Tokenizer"><text x="274" y="648" font-family="Segoe UI" font-size="13" font-weight="600" text-anchor="start" fill="#171C26">Qwen 12 Hz Tokenizer</text><text x="274" y="664" font-family="Segoe UI" font-size="12" font-weight="400" text-anchor="start" fill="#576579">Supports Qwen voice synthesis</text><text x="1068" y="655" font-family="Segoe UI" font-size="12" font-weight="400" text-anchor="end" fill="#576579">Not installed</text><line x1="1081" y1="651.0" x2="1085" y2="655.0" stroke="#576579" stroke-width="1.5" stroke-linecap="round" /><line x1="1085" y1="655.0" x2="1089" y2="651.0" stroke="#576579" stroke-width="1.5" stroke-linecap="round" /><line x1="264" y1="677" x2="1100" y2="677" stroke="#DDE2EA" stroke-width="1" stroke-linecap="round" /></g></g></svg>